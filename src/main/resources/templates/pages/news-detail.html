<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(title='|新|闻|详|情| - |安|徽|宁|商|科|技|集|团|有|限|公|司')"></head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="pagebanner" style="background-image:url('/images/news-center-banner.jpeg')"></div>
<div class="section"><div class="wrap">
<div class="content-detail">
<div class="detail-head">
<h1 th:text="${news} ? ${news.title} : '文章未找到'">新闻标题</h1>
<div class="meta" th:if="${news}">
<span class="cat" th:text="${news.categoryName}">分类</span> | 
<span th:text="${news.date}">2026-07</span> | 
<span th:text="${news.author}">作者</span> | 
<span th:text="${news.source}">来源</span>
</div>
</div>
<div class="detail-body" th:if="${news}" th:utext="${@richText.clean(news.body)}">
</div>
<div class="detail-body" th:unless="${news}">
<p style="text-align:center;color:#999;">未找到对应的文章，请<a th:href="@{/news}">返回新闻中心</a>查看完整列表。</p>
</div>
<div class="detail-foot" style="margin-top:40px;padding-top:24px;border-top:1px solid #e6e6e6;text-align:center;">
<a th:href="@{/news}" style="display:inline-block;padding:10px 28px;background:#c8a45c;color:#fff;border-radius:4px;text-decoration:none;font-size:14px;">返回新闻中心</a>
</div>
</div>
</div></div>
<div th:replace="fragments/footer :: footer"></div>
<input type="hidden" id="currentPage" value="news">
</body></html>
