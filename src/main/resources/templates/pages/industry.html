<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(title='|集|团|产|业| - |安|徽|宁|商|科|技|集|团|有|限|公|司')"></head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="pagebanner imgbanner"><img th:src="${#strings.isEmpty(siteContent['bg_industry_banner']) ? '/images/industry-banner.jpeg' : siteContent['bg_industry_banner']}" alt="集团产业"></div>
<div class="section text-bg-industry" th:style="'background-image:url(\'' + (${#strings.isEmpty(siteContent['bg_industry_page'])} ? '/images/2945347C3CC652EA1119F1A7F09DC2A9.jpg' : ${siteContent['bg_industry_page']}) + '\')'"><div class="wrap">
<div class="sec-head">
<span class="en">SUBSIDIARIES</span>
<h3>成员企业</h3>
<p>多元产业协同发展，构建覆盖多领域的产业服务生态</p>
</div>
<div class="content-list">
<a class="list-item" th:each="sub : ${subsidiaries}" th:href="@{/industry/{id}(id=${sub.id})}">
<div class="thumb"><img th:src="${sub.logo}" alt=""></div>
<div class="info">
<h4 th:text="${sub.name}">子公司名称</h4>
<div class="meta" th:text="${sub.englishName} + ' · ' + ${sub.category}">ENGLISH NAME · 类别</div>
<div class="rich-content" th:utext="${@richText.clean(sub.description)}">描述</div>
</div>
</a>
</div>
</div></div>
<div th:replace="fragments/footer :: footer"></div>
<input type="hidden" id="currentPage" value="industry">
</body></html>
