<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(title='|企|业|文|化| - |安|徽|宁|商|科|技|集|团|有|限|公|司')"></head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="pagebanner imgbanner"><img th:src="${#strings.isEmpty(siteContent['bg_about_banner']) ? '/images/1.jpg' : siteContent['bg_about_banner']}" alt="集团概况"></div>
<div class="subnav-tabs"><div class="wrap">
<a th:href="@{/about-intro}">集团简介</a>
<a th:href="@{/about-speech}">董事长致词</a>
<a th:href="@{/about-events}">发展大事记</a>
<a th:href="@{/about-team}">管理团队</a>
<a th:href="@{/about-honor}">企业荣誉</a>
<a th:href="@{/about-party}">党建工作</a>
<a th:href="@{/about-culture}" class="on">企业文化</a>
</div></div>
<div class="section"><div class="wrap">
<div class="content-detail">
<div class="detail-head"><h1>企业文化理念</h1><div class="meta">以文化铸牢企魂 · 以理念凝聚共识</div></div>
<div class="culture-content">
<div class="culture-section">
<h3>扎根本土，做有根的事业</h3>
<div class="lead rich-content" th:utext="${#strings.isEmpty(siteContent['culture_lead']) ? '<p>安徽宁商科技集团生长于合肥科创热土，扎根巢湖之滨。</p>' : @richText.clean(siteContent['culture_lead'])}"></div>
</div>
<div class="culture-section">
<h3>核心价值理念</h3>
<div class="culture-values">
<div class="cv-item"><div class="cv-label">MISSION</div><div class="cv-text rich-content" th:utext="${#strings.isEmpty(siteContent['culture_mission']) ? '<p>科创赋能城乡，数字服务实业</p>' : @richText.clean(siteContent['culture_mission'])}"></div></div>
<div class="cv-item"><div class="cv-label">CORE VALUES</div><div class="cv-text rich-content" th:utext="${#strings.isEmpty(siteContent['culture_values']) ? '<p>徽商固本 · 科创致远 · 协同共生 · 开放共赢</p>' : @richText.clean(siteContent['culture_values'])}"></div></div>
<div class="cv-item"><div class="cv-label">VISION</div><div class="cv-text rich-content" th:utext="${#strings.isEmpty(siteContent['culture_vision']) ? '<p>城湖共生处，笃行向远方</p>' : @richText.clean(siteContent['culture_vision'])}"></div></div>
<div class="cv-item"><div class="cv-label">SPIRIT</div><div class="cv-text rich-content" th:utext="${#strings.isEmpty(siteContent['culture_spirit']) ? '<p>务实笃行 · 创新赋能 · 诚信致远</p>' : @richText.clean(siteContent['culture_spirit'])}"></div></div>
</div>
</div>
</div>
</div>
</div></div>
<div th:replace="fragments/footer :: footer"></div>
<input type="hidden" id="currentPage" value="about">
</body></html>
