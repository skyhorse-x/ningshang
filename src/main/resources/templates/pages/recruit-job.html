<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(title='|招|聘|岗|位| - |安|徽|宁|商|科|技|集|团|有|限|公|司')"></head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="pagebanner imgbanner"><img src="/images/contact-banner.jpeg" alt="招聘岗位"></div>
<div class="subnav-tabs"><div class="wrap">
<a th:href="@{/recruit}">人才理念</a>
<a th:href="@{/recruit-job}" class="on">招聘岗位</a>
<a th:href="@{/contact}">联系方式</a>
<a th:href="@{/contact-message}">在线留言</a>
</div></div>
<div class="section text-bg-job"><div class="wrap">
<div class="content-detail">
<div class="detail-head"><h1>招聘岗位</h1></div>
<div class="detail-body">
<p>诚邀志同道合者，与宁商同心同行、共赴远方</p>
<div class="job-list" th:if="${jobs != null and !#lists.isEmpty(jobs)}">
<div class="job-item" th:each="jb : ${jobs}">
<div class="job-head"><h4 th:text="${jb.title}">岗位名称</h4><span class="job-dept" th:text="${jb.department}">部门</span></div>
<div class="job-tags">
<span th:if="${!#strings.isEmpty(jb.headcount)}" th:text="'✦ 招聘人数：' + ${jb.headcount}">✦ 招聘人数：3人</span>
<span th:if="${!#strings.isEmpty(jb.location)}" th:text="'✦ 工作地点：' + ${jb.location}">✦ 工作地点：合肥</span>
<span th:if="${!#strings.isEmpty(jb.education)}" th:text="'✦ 学历要求：' + ${jb.education}">✦ 学历要求：本科及以上</span>
</div>
<div class="job-desc" th:if="${!#strings.isEmpty(jb.description)}"><b>岗位描述：</b><span class="rich-content" th:utext="${@richText.clean(jb.description)}">岗位描述</span></div>
</div>
</div>
<p th:if="${jobs == null or #lists.isEmpty(jobs)}">暂无在招岗位</p>
</div>
</div>
</div></div>
<div th:replace="fragments/footer :: footer"></div>
<input type="hidden" id="currentPage" value="contact">
</body></html>
