<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(title='|企|业|荣|誉| - |安|徽|宁|商|科|技|集|团|有|限|公|司')"></head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="pagebanner" th:style="'background-image:url(\'' + (${#strings.isEmpty(siteContent['bg_about_banner'])} ? '/images/1.jpg' : ${siteContent['bg_about_banner']}) + '\')'"></div>
<div class="subnav-section"><div class="wrap"><span class="title">集团概况</span></div></div>
<div class="subnav-tabs"><div class="wrap">
<a th:href="@{/about-intro}">集团简介</a>
<a th:href="@{/about-speech}">董事长致词</a>
<a th:href="@{/about-events}">发展大事记</a>
<a th:href="@{/about-team}">管理团队</a>
<a th:href="@{/about-honor}" class="on">企业荣誉</a>
<a th:href="@{/about-party}">党建工作</a>
<a th:href="@{/about-culture}">企业文化</a>
</div></div>
<div class="section"><div class="wrap">
<div class="content-detail">
<div class="detail-head"><h1>企业荣誉</h1><div class="meta">以专业资质铸就品牌 以自主创新赢得信赖</div></div>
<div class="detail-body"><p>集团始终坚持以专业资质铸就品牌、以自主创新赢得信赖。</p></div>
</div>
<div class="honor-grid">
<div class="honor-card" th:each="honor : ${honors}">
<img th:src="${honor.image}" alt="" class="honor-bg" loading="lazy">
<div class="honor-mask"></div>
<div class="honor-content">
<div class="ico" th:text="${honor.icon}">🏅</div>
<h5 th:text="${honor.title}">荣誉标题</h5>
<div class="rich-content" th:utext="${@richText.clean(honor.description)}">荣誉描述</div>
</div>
</div>
</div>
</div></div>
<div th:replace="fragments/footer :: footer"></div>
<input type="hidden" id="currentPage" value="about">
</body></html>
