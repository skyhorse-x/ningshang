<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(title='|在|线|留|言| - |安|徽|宁|商|科|技|集|团|有|限|公|司')"></head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="pagebanner" th:style="'background-image:url(\'' + (${#strings.isEmpty(siteContent['bg_contact_banner'])} ? '/images/contact-banner.jpeg' : ${siteContent['bg_contact_banner']}) + '\')'"></div>
<div class="subnav-section"><div class="wrap"><span class="title">联系宁商</span></div></div>
<div class="subnav-tabs"><div class="wrap">
<a th:href="@{/recruit}">人才理念</a>
<a th:href="@{/recruit-job}">招聘岗位</a>
<a th:href="@{/contact}">联系方式</a>
<a th:href="@{/contact-message}" class="on">在线留言</a>
</div></div>
<div class="section"><div class="wrap">
<div class="content-detail">
<div class="detail-head"><h1>在线留言</h1></div>
<div class="detail-body">
<p>欢迎留下您的需求与建议，我们将尽快与您联系</p>
<form class="contact-form">
<div class="form-row"><input type="text" name="name" placeholder="您的姓名" required><input type="tel" name="phone" placeholder="联系电话" required></div>
<div class="form-row"><input type="email" name="email" placeholder="电子邮箱"><select name="type"><option value="" disabled selected>留言类型</option><option value="cooperation">合作咨询</option><option value="recruit">招聘求职</option><option value="business">业务洽谈</option><option value="other">其他</option></select></div>
<div class="form-row"><textarea name="message" placeholder="请输入留言内容" required></textarea></div>
<button type="submit" class="btn">提交留言</button>
</form>
</div>
</div>
</div></div>
<div th:replace="fragments/footer :: footer"></div>
<input type="hidden" id="currentPage" value="contact">
</body></html>
