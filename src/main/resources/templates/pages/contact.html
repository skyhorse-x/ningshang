<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(title='|联|系|方|式| - |安|徽|宁|商|科|技|集|团|有|限|公|司')"></head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="pagebanner imgbanner"><img th:src="${#strings.isEmpty(siteContent['bg_contact_banner']) ? '/images/contact-banner.jpeg' : siteContent['bg_contact_banner']}" alt="联系方式"></div>
<div class="subnav-tabs"><div class="wrap">
<a th:href="@{/recruit}">人才理念</a>
<a th:href="@{/recruit-job}">招聘岗位</a>
<a th:href="@{/contact}" class="on">联系方式</a>
</div></div>
<div class="section text-bg-contact" th:style="'background-image:url(\'' + (${#strings.isEmpty(siteContent['bg_contact_page'])} ? '/images/b.jpg' : ${siteContent['bg_contact_page']}) + '\')'"><div class="wrap">
<div class="content-detail">
<div class="detail-head"><h1>联系方式</h1></div>
<div class="detail-body">
<div class="contact-info">
<div class="ci-item"><div class="ico">📍</div><div><h5>公司地址</h5><p th:text="${#strings.isEmpty(siteContent['contact_address']) ? '安徽省合肥市蜀山区24号创新工场' : siteContent['contact_address']}">安徽省合肥市蜀山区24号创新工场</p></div></div>
<div class="ci-item"><div class="ico">✆</div><div><h5>服务热线</h5><p th:text="${#strings.isEmpty(siteContent['contact_phone']) ? '13365745652' : siteContent['contact_phone']}">13365745652</p></div></div>
<div class="ci-item"><div class="ico">✉</div><div><h5>电子邮箱</h5><p th:text="${#strings.isEmpty(siteContent['contact_email']) ? 'NStechnology@163.com' : siteContent['contact_email']}">NStechnology@163.com</p></div></div>
<div class="ci-item"><div class="ico">🕑</div><div><h5>办公时间</h5><p th:text="${#strings.isEmpty(siteContent['office_hours']) ? '周一至周五　09:00 - 18:00' : siteContent['office_hours']}">周一至周五　09:00 - 18:00</p></div></div>
</div>
</div>
</div>
</div></div>
<div th:replace="fragments/footer :: footer"></div>
<input type="hidden" id="currentPage" value="contact">
</body></html>
