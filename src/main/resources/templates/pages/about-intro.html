<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(title='|集|团|简|介| - |安|徽|宁|商|科|技|集|团|有|限|公|司')">
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="pagebanner" th:style="'background-image:url(\'' + (${#strings.isEmpty(siteContent['bg_about_banner'])} ? '/images/1.jpg' : ${siteContent['bg_about_banner']}) + '\')'"></div>
<div class="subnav-tabs">
  <div class="wrap">
    <a th:href="@{/about-intro}" class="on">集团简介</a>
    <a th:href="@{/about-speech}">董事长致词</a>
    <a th:href="@{/about-events}">发展大事记</a>
    <a th:href="@{/about-team}">管理团队</a>
    <a th:href="@{/about-honor}">企业荣誉</a>
    <a th:href="@{/about-party}">党建工作</a>
    <a th:href="@{/about-culture}">企业文化</a>
  </div>
</div>
<div class="section about-text-section" th:style="'background-image:url(\'' + (${#strings.isEmpty(siteContent['bg_about_page'])} ? '/images/about-pic.jpeg' : ${siteContent['bg_about_page']}) + '\')'">
  <div class="wrap">
    <div class="content-detail">
      <div class="detail-head">
        <h1>安徽宁商科技集团有限公司</h1>
        <div class="meta" th:text="${#strings.isEmpty(siteContent['about_intro_meta']) ? '一徽藏一城，一潮见格局' : siteContent['about_intro_meta']}">一徽藏一城，一潮见格局</div>
      </div>
      <div class="detail-body">
        <div class="intro-section">
          <h3 th:text="${#strings.isEmpty(siteContent['about_intro_s1_title']) ? '徽韵承城，扎根本土根基' : siteContent['about_intro_s1_title']}">徽韵承城，扎根本土根基</h3>
          <div class="rich-content" th:if="${#strings.isEmpty(siteContent['about_intro_s1_body'])}"><p>安徽宁商科技集团有限公司扎根安徽合肥，深度契合合肥"城湖共生"的城市格局与科创引领的发展脉络。</p></div>
          <div class="rich-content" th:unless="${#strings.isEmpty(siteContent['about_intro_s1_body'])}" th:utext="${@richText.clean(siteContent['about_intro_s1_body'])}"></div>
        </div>
        <div class="intro-section">
          <h3 th:text="${#strings.isEmpty(siteContent['about_intro_s2_title']) ? '潮涌科创，锚定主业航向' : siteContent['about_intro_s2_title']}">潮涌科创，锚定主业航向</h3>
          <div class="rich-content" th:if="${#strings.isEmpty(siteContent['about_intro_s2_body'])}"><p>集团以数字科技为核心发展主线，奔涌拓展业务边界，形成覆盖技术研发、系统集成、数字文创的多元核心业务体系。</p></div>
          <div class="rich-content" th:unless="${#strings.isEmpty(siteContent['about_intro_s2_body'])}" th:utext="${@richText.clean(siteContent['about_intro_s2_body'])}"></div>
        </div>
        <div class="intro-section">
          <h3 th:text="${#strings.isEmpty(siteContent['about_intro_s3_title']) ? '五子联动，共筑产业潮头' : siteContent['about_intro_s3_title']}">五子联动，共筑产业潮头</h3>
          <div class="sub-grid-new">
            <div class="sub-item" th:each="sub : ${subsidiaries}">
              <div class="logo-area"><img th:src="${sub.logo}" alt=""></div>
              <div class="info-area">
                <h4 th:text="${sub.name}">子公司名称</h4>
                <div class="rich-content" th:utext="${@richText.clean(sub.description)}">子公司描述</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="stats">
  <div class="wrap">
    <div class="item"><div class="num" th:text="${#strings.isEmpty(siteContent['stat_founded']) ? '2018' : siteContent['stat_founded']}">2018</div><div class="lbl">成立年份</div></div>
    <div class="item"><div class="num" th:text="${#strings.isEmpty(siteContent['stat_companies']) ? '4' : siteContent['stat_companies']}">4</div><div class="lbl">成员企业</div></div>
    <div class="item"><div class="num" th:text="${#strings.isEmpty(siteContent['stat_ip']) ? '10+' : siteContent['stat_ip']}">10+</div><div class="lbl">知识产权</div></div>
    <div class="item"><div class="num" th:text="${#strings.isEmpty(siteContent['stat_fields']) ? '4' : siteContent['stat_fields']}">4</div><div class="lbl">业务领域</div></div>
  </div>
</div>
<div th:replace="fragments/footer :: footer"></div>
<input type="hidden" id="currentPage" value="about">
</body>
</html>
