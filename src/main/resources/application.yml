server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/ningshang?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

# JWT Config
# 生产环境必须通过环境变量 JWT_SECRET 覆盖（至少 32 字节随机字符串）
jwt:
  secret: ${JWT_SECRET:ningshang-dev-secret-2026-change-me-in-production}
  expire: 86400000

# 初始管理员密码（仅首次启动创建账号时使用；已有账号不会被重置）
# 生产环境通过环境变量 ADMIN_DEFAULT_PASSWORD 覆盖，并在首次登录后修改
admin:
  default-password: ${ADMIN_DEFAULT_PASSWORD:123456}

# 富文本图片上传保存目录（相对路径基于应用启动目录）
app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  # 允许跨域的来源，生产环境改为实际域名，如 https://www.example.com,https://admin.example.com
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080,http://127.0.0.1:8080}

logging:
  level:
    com.ningshang: DEBUG

